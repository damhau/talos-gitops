apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  # Bare-metal Traefik runs as NodePort, so Ingress.status.loadBalancer.ingress
  # stays empty and ArgoCD's default check parks every Ingress at Progressing.
  resource.customizations.health.networking.k8s.io_Ingress: |
    hs = { status = "Healthy", message = "" }
    return hs
