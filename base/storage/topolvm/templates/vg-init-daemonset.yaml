{{- if .Values.vgInit.enabled }}
# Creates the LVM volume group consumed by topolvm-node on every cluster node.
# Runs lvm2 inside the container (Talos host is shell-less so nsenter PID 1 + /bin/sh
# is not possible). /dev is hostPath-mounted so lvm sees the host disks.
# Idempotent — re-running is a no-op when the VG already exists.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: topolvm-vg-init
  labels:
    app.kubernetes.io/name: topolvm-vg-init
    app.kubernetes.io/part-of: topolvm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: topolvm-vg-init
  template:
    metadata:
      labels:
        app.kubernetes.io/name: topolvm-vg-init
    spec:
      tolerations:
        - operator: Exists
      initContainers:
        - name: vg-init
          image: {{ .Values.vgInit.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: VG_NAME
              value: {{ .Values.vgInit.volumeGroup | quote }}
            - name: VG_DEVICE
              value: {{ .Values.vgInit.device | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache lvm2
              if vgs "$VG_NAME" >/dev/null 2>&1; then
                echo "VG $VG_NAME already exists, skipping"
                exit 0
              fi
              if [ ! -b "$VG_DEVICE" ]; then
                echo "ERROR: $VG_DEVICE is not a block device" >&2
                echo "Available block devices:" >&2
                ls -la /dev/sd* /dev/vd* /dev/nvme* 2>/dev/null >&2 || true
                exit 1
              fi
              if ! pvs "$VG_DEVICE" >/dev/null 2>&1; then
                pvcreate "$VG_DEVICE"
              fi
              vgcreate "$VG_NAME" "$VG_DEVICE"
              echo "Created VG $VG_NAME on $VG_DEVICE"
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: run-lvm
              mountPath: /run/lvm
            - name: sys
              mountPath: /sys
      containers:
        # Keeps the DaemonSet pod alive after vg-init succeeds so the DS reports Ready.
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
      volumes:
        - name: dev
          hostPath:
            path: /dev
        - name: run-lvm
          hostPath:
            path: /run/lvm
            type: DirectoryOrCreate
        - name: sys
          hostPath:
            path: /sys
{{- end }}
