# Pre-deploy DaemonSet that creates the LVM volume group on every node
# before topolvm-node consumes it. Idempotent: skips if VG already exists.
# Runs lvm2 inside the container (Talos has no host shell to nsenter into) with
# /dev hostPath-mounted. The container installs lvm2 from alpine at startup.
# If volumeGroup changes here, also update topolvm.lvmd.deviceClasses[].volume-group below.
vgInit:
  enabled: true
  device: /dev/sdb
  volumeGroup: datavg
  image: alpine:3.19

topolvm:
  snapshot:
    enabled: true
  controller:
    replicaCount: 1
    prometheus:
      podMonitor:
        enabled: true
        additionalLabels:
          release: prometheus-operator
  cert-manager:
    enabled: false  # Set to true if cert-manager is not already installed
  storageClasses:
    - name: topolvm-provisioner
      storageClass:
        fsType: xfs
        isDefaultClass: true
        volumeBindingMode: WaitForFirstConsumer
        allowVolumeExpansion: true
        additionalParameters:
          topolvm.io/device-class: default
    - name: topolvm-provisioner-thin
      storageClass:
        fsType: xfs
        isDefaultClass: false
        volumeBindingMode: WaitForFirstConsumer
        allowVolumeExpansion: true
        additionalParameters:
          topolvm.io/device-class: thin
  lvmd:
    deviceClasses:
      - name: default
        volume-group: datavg
        default: true
        spare-gb: 10
    prometheus:
      podMonitor:
        enabled: true
        additionalLabels:
          release: prometheus-operator
  node:
    prometheus:
      podMonitor:
        enabled: true
        additionalLabels:
          release: prometheus-operator