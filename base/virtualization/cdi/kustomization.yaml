apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/kubevirt/containerized-data-importer/releases/download/v1.64.0/cdi-operator.yaml
  - cdi-cr.yaml
  - cdi-uploadproxy-ingress.yaml

components:
  - ../../../components/ingress-host

replacements:
  - source:
      kind: ConfigMap
      name: cluster-domain
      fieldPath: data.routeMatch
    targets:
      - select:
          kind: IngressRoute
        fieldPaths:
          - spec.routes.*.match
  - source:
      kind: ConfigMap
      name: cluster-domain
      fieldPath: data.uploadProxyUrl
    targets:
      - select:
          kind: CDI
          name: cdi
        fieldPaths:
          - spec.config.uploadProxyURLOverride
