apiVersion: v1
kind: Namespace
metadata:
  name: kubevmui
  labels:
    app.kubernetes.io/name: kubevmui
    app.kubernetes.io/part-of: kubevmui
    # libguestfs needs SYS_ADMIN + /dev/kvm passthrough; both are blocked
    # by baseline/restricted Pod Security Standards.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
