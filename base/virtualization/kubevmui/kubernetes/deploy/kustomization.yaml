apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CRDs and the cdi-clone ClusterRoleBinding are shared with other deploy
# methods (Helm, etc.); reference them so a single `kubectl apply -k .` is
# enough to bootstrap a fresh cluster.
resources:
  - ../crds/images.kubevmui.io.yaml
  - ../crds/templates.kubevmui.io.yaml
  - ../crds/migrationplans.kubevmui.io.yaml
  - ../crds/networks.kubevmui.io.yaml
  - ../crds/securitygroups.kubevmui.io.yaml
  - ../crds/firewallpolicies.kubevmui.io.yaml
  - ../crds/catalogentries.kubevmui.io.yaml
  - ../rbac/cdi-clone-rbac.yaml
  - 00-namespace.yaml
  - 01-serviceaccount.yaml
  - 02-rbac.yaml
  - 03-deployment.yaml
  - 04-service.yaml
  # Uncomment after editing the host:
  # - 05-ingress.yaml

images:
  - name: kubevmui
    newName: kubevmui
    newTag: 0.0.2
