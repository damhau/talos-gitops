# Cluster identity. Overridden per-cluster by clusters/<name>/values.yaml.
cluster:
  name: ""
  domain: ""

# Source repo coordinates used by every Application this chart renders.
repo:
  url: https://github.com/damhau/talos-gitops.git
  revision: main

# The platform catalog. Edits here apply fleet-wide.
components:
  helm:
    # privileged: true → ArgoCD labels the destination namespace with PSA `privileged`
    # so Talos's baseline-default cluster admits hostPath / privileged / hostPID workloads.
    - { name: cert-manager,        path: base/security/cert-manager,          namespace: cert-manager,    wave: 1 }
    - { name: topolvm,             path: base/storage/topolvm,                namespace: topolvm-system,  wave: 1, privileged: true }
    # - { name: csi-driver-smb,      path: base/storage/csi-driver-smb,         namespace: kube-system,     wave: 1 }
    - { name: traefik,             path: base/ingress/traefik,                namespace: traefik,         wave: 2 }
    - { name: tls,                 path: base/security/tls,                   namespace: cert-manager,    wave: 3 }
    - { name: metrics-server,      path: base/monitoring/metrics-server,      namespace: kube-system,     wave: 4 }
    - { name: prometheus-operator, path: base/monitoring/prometheus-operator, namespace: monitoring,      wave: 4, privileged: true }
    - { name: victorialogs,        path: base/logging/victorialogs,           namespace: logging,         wave: 4, privileged: true }
    - { name: vector,              path: base/logging/vector,                 namespace: logging,         wave: 4, privileged: true }
    - { name: authelia,            path: base/security/authelia,              namespace: authelia,        wave: 4 }
    - { name: k8up,                path: base/storage/k8up,                   namespace: k8up,            wave: 5 }
    - { name: restic-rest-server,  path: base/storage/restic-rest-server,     namespace: restic,          wave: 5 }
    - { name: console,             path: base/virtualization/console,         namespace: console,         wave: 6 }
    - { name: argocd-config,       path: base/management/argocd-config,       namespace: argocd,          wave: 7 }
    - { name: launcher,            path: base/apps/launcher,                  namespace: launcher,        wave: 8 }

  # hostPrefix is the subdomain prefix the ingress-host Component rewrites to.
  # Omit when the component has no Ingress/IngressRoute/CDI — skips the kustomize patch block.
  kustomize:
    - { name: external-snapshotter, path: base/storage/external-snapshotter,      namespace: kube-system,      wave: 0 }
    - { name: multus-cni,           path: base/virtualization/multus-cni,         namespace: kube-system,      wave: 5 }
    # - { name: kubernetes-nmstate,   path: base/virtualization/kubernetes-nmstate, namespace: nmstate,          wave: 5, privileged: true }
    - { name: kubevirt,             path: base/virtualization/kubevirt,           namespace: kubevirt,         wave: 5, privileged: true }
    - { name: cdi,                  path: base/virtualization/cdi,                namespace: cdi,              wave: 5, privileged: true, hostPrefix: cdi-uploadproxy }
    - { name: kubevirt-manager,     path: base/virtualization/kubevirt-manager,   namespace: kubevirt-manager, wave: 6, hostPrefix: kubevirt-manager }
    - { name: podinfo,              path: base/apps/podinfo,                      namespace: podinfo,          wave: 7, hostPrefix: podinfo }

# Per-component Helm valuesObject DEFAULTS. Templated with `tpl` against this chart's
# values at render time, so strings like `{{ .Values.cluster.domain }}` resolve to the
# current cluster's domain. Cluster-specific componentValues (in clusters/<name>/values.yaml)
# are deep-merged on top — overrides win.
#
# Use this for cluster-aware values that follow a predictable pattern (URLs derived from
# the domain). Put genuine per-cluster knobs (credentials, fileserver hostnames, etc.) in
# clusters/<name>/values.yaml componentValues instead.
componentDefaults:
  # Talos's kubelet uses a self-signed cert; metrics-server can't verify it.
  metrics-server:
    metrics-server:
      args:
        - --kubelet-insecure-tls

  prometheus-operator:
    kube-prometheus-stack:
      grafana:
        grafana.ini:
          server:
            root_url: "https://grafana.{{ .Values.cluster.domain }}"
          auth.generic_oauth:
            auth_url:  "https://auth.{{ .Values.cluster.domain }}/api/oidc/authorization"
            token_url: "https://auth.{{ .Values.cluster.domain }}/api/oidc/token"
            api_url:   "https://auth.{{ .Values.cluster.domain }}/api/oidc/userinfo"

  console:
    openshift-console:
      console:
        baseUrl: "https://console.{{ .Values.cluster.domain }}"

  authelia:
    authelia:
      configMap:
        session:
          cookies:
            - domain: "{{ .Values.cluster.domain }}"
              subdomain: auth
              default_redirection_url: "https://launcher.{{ .Values.cluster.domain }}"
        identity_providers:
          oidc:
            clients:
              - client_id: grafana
                client_name: Grafana
                client_secret: '$pbkdf2-sha512$310000$E45bEthWr8A3/IMLAmhImQ$VTpPaY0LsollUDpJiPoE4Z.UU55mleW4O9WdJz65Bq5D9XFr1g4MmavTsC2e64vfkUVZDuWctrAxil0py8MSKQ'
                authorization_policy: one_factor
                consent_mode: implicit
                require_pkce: true
                pkce_challenge_method: S256
                redirect_uris:
                  - "https://grafana.{{ .Values.cluster.domain }}/login/generic_oauth"
                scopes:
                  - openid
                  - profile
                  - email
                  - groups
                response_types:
                  - code
                grant_types:
                  - authorization_code
                token_endpoint_auth_method: client_secret_basic
              - client_id: argocd
                client_name: Argo CD
                client_secret: '$pbkdf2-sha512$310000$886qAF.DrXVG99BjziyF7Q$oiHilKQKjDPBLpUBXxCo2RGWQBBIoDvHm3rjYs8wD1T13rVTNQu1u07UX.19El6q.xWix4luMTlUdtQ9o1KlxA'
                authorization_policy: one_factor
                consent_mode: implicit
                redirect_uris:
                  - "https://argocd.{{ .Values.cluster.domain }}/auth/callback"
                scopes:
                  - openid
                  - profile
                  - email
                  - groups
                response_types:
                  - code
                grant_types:
                  - authorization_code
                token_endpoint_auth_method: client_secret_basic
              - client_id: argocd-cli
                client_name: Argo CD CLI
                public: true
                authorization_policy: one_factor
                consent_mode: implicit
                require_pkce: true
                pkce_challenge_method: S256
                redirect_uris:
                  - http://localhost:8085/auth/callback
                scopes:
                  - openid
                  - offline_access
                  - email
                  - groups
                grant_types:
                  - authorization_code
                  - refresh_token
                token_endpoint_auth_method: none

# Cluster-specific overrides. Deep-merged on top of componentDefaults; keys match
# components.helm[].name. Use this for values that genuinely vary per cluster and
# can't be derived from cluster.domain (credentials, external fileserver hostnames, etc.).
componentValues: {}

# Per-component Argo CD ignoreDifferences entries. Keys must match the component name.
ignoreDifferences:
  kubevirt:
    - group: kubevirt.io
      kind: KubeVirt
      jsonPointers:
        - /spec/configuration
        - /spec/customizeComponents
        - /spec/certificateRotateStrategy
        - /spec/workloadUpdateStrategy
        - /status
  cdi:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: cdis.cdi.kubevirt.io
      jsonPointers:
        - /spec
