cluster:
  name: dha
  domain: dha.dhconsulting.ch

# Per-cluster overrides that can't be derived from cluster.domain. Deep-merged on top
# of chart/platform/values.yaml componentDefaults — overrides win. Keys match
# components.helm[].name.
componentValues:
  restic-rest-server:
    smb:
      source: "//CHANGEME.dha.dhconsulting.ch/backup"
      username: "CHANGEME"
      password: "CHANGEME"
    resticUsers: |
      k8up:$2y$05$CHANGEME
