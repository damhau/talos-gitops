cluster:
  name: dha
  domain: dha.dhconsulting.ch

# Per-component Helm value overrides. Keys match components.helm[].name in chart/platform/values.yaml.
# The AppSet template lifts each entry into the matching Application's valuesObject.
componentValues:
  prometheus-operator:
    kube-prometheus-stack:
      grafana:
        grafana.ini:
          server:
            root_url: "https://grafana.dha.dhconsulting.ch"
          auth.generic_oauth:
            auth_url: "https://auth.dha.dhconsulting.ch/api/oidc/authorization"
            token_url: "https://auth.dha.dhconsulting.ch/api/oidc/token"
            api_url: "https://auth.dha.dhconsulting.ch/api/oidc/userinfo"

  console:
    openshift-console:
      console:
        baseUrl: "https://console.dha.dhconsulting.ch"

  restic-rest-server:
    smb:
      source: "//CHANGEME.dha.dhconsulting.ch/backup"
      username: "CHANGEME"
      password: "CHANGEME"
    resticUsers: |
      k8up:$2y$05$CHANGEME
