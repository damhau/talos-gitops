authelia:
  pod:
    kind: Deployment
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
    extraVolumeMounts:
      - name: users
        mountPath: /users
        readOnly: true
    extraVolumes:
      - name: users
        secret:
          secretName: authelia-users

  ingress:
    enabled: false
    traefikCRD:
      enabled: false

  configMap:
    theme: light

    authentication_backend:
      file:
        enabled: true
        path: /users/users_database.yml
        watch: true
        password:
          algorithm: bcrypt
          bcrypt:
            cost: 12
      ldap:
        enabled: false

    session:
      name: authelia_session
      same_site: lax
      expiration: 12h
      inactivity: 5m
      remember_me: 1M
      encryption_key:
        value: 'b678125b5d603a03623cfafd4bc81e9317a890abafd117cfa12cb789feabfe0f'
      cookies:
        - domain: dha.dhconsulting.ch
          subdomain: auth
          default_redirection_url: https://launcher.dha.dhconsulting.ch

    storage:
      local:
        enabled: true
        path: /config/db.sqlite3
      encryption_key:
        value: '858dd4792693e12b27a656cfe26d6d98e3231aab2adc47ef0d1b2bb82420f563'

    notifier:
      filesystem:
        enabled: true
        filename: /config/notification.txt

    access_control:
      default_policy: one_factor

    identity_providers:
      oidc:
        enabled: true
        hmac_secret:
