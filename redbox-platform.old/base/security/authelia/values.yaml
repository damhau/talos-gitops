        cors:
          endpoints:
            - authorization
            - token
            - userinfo
            - revocation
            - introspection
          allowed_origins_from_client_redirect_uris: true
        clients:
          - client_id: grafana
            client_name: Grafana
            client_secret: '$pbkdf2-sha512$310000$E45bEthWr8A3/IMLAmhImQ$VTpPaY0LsollUDpJiPoE4Z.UU55mleW4O9WdJz65Bq5D9XFr1g4MmavTsC2e64vfkUVZDuWctrAxil0py8MSKQ'
