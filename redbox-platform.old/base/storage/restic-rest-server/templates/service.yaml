apiVersion: v1
kind: Service
metadata:
  name: restic-rest-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: restic-rest-server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: restic-rest-server
