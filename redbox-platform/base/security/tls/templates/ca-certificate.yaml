apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.caName }}
  namespace: cert-manager
spec:
  isCA: true
  commonName: {{ .Values.caName }}
  secretName: {{ .Values.caName }}-tls
  duration: 87600h # 10 years
  privateKey:
    algorithm: RSA
    size: 4096
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
